name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Test Suite (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run backend tests
        run: |
          cd backend
          pytest --ignore=tests/test_postgres_integration.py -v
        env:
          APP_ENV: test
          PYTHONPATH: .

  postgres-integration:
    name: PostgreSQL Integration & Migration (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quant_user
          POSTGRES_PASSWORD: quant_ci_test_password_not_for_production
          POSTGRES_DB: quant_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run PostgreSQL migrations & integration tests
        run: |
          cd backend
          alembic upgrade head
          pytest tests/test_postgres_integration.py -v
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://quant_user:quant_ci_test_password_not_for_production@localhost:5432/quant_test_db
          POSTGRES_TEST_URL: postgresql+psycopg://quant_user:quant_ci_test_password_not_for_production@localhost:5432/quant_test_db
          PYTHONPATH: .

  frontend-build-and-test:
    name: Frontend Build, Lint & Test (Node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run linter
        run: |
          cd frontend
          npm run lint

      - name: Run unit and integration tests
        run: |
          cd frontend
          npm test

      - name: Build production bundle
        run: |
          cd frontend
          npm run build
